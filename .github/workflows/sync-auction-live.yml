name: Sync NPL auction live updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: npl-auction-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync auction data
        run: npm run auction:sync

      - name: Commit auction sync
        run: |
          if git diff --quiet -- auction.html data/npl-auction-live.json; then
            echo "No auction sync changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auction.html data/npl-auction-live.json
          git commit -m "Auto sync NPL auction live updates"
          git push
